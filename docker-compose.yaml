services:
  experiment-guide:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: experiment-guide
    restart: unless-stopped
    ports:
      - 8765:8765
    environment:
      APP_ACCESS_KEY: ${APP_ACCESS_KEY:-123}
    networks:
      - experiment-guide-network

networks:
  experiment-guide-network:
    driver: bridge
