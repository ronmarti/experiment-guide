services:
  experiment-guide:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: experiment-guide
    restart: unless-stopped
    ports:
      - 8765:8765
    volumes:
      - data:/data
    networks:
      - experiment-guide-network

volumes:
  data:
    driver: local

networks:
  experiment-guide-network:
    driver: bridge
