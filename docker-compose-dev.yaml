services:
  experiment-guide:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: experiment-guide
    restart: always
    # env_file:
    #   - ./secrets/.env
    ports:
      - 8756:8756 
    environment:
      APP_ACCESS_KEY: ${APP_ACCESS_KEY:-change-me}
    volumes:
      - .:/experiment-guide:delegated
    networks:
      - experiment-guide-network
    command: sleep infinity

# volumes:
#   data:
#     driver: local

networks:
  experiment-guide-network:
    driver: bridge